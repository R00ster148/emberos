set default=0
insmod cpuid
if ! cpuid -l; then
  set timeout=-1
  menuentry "This VM is set to 32-bit. Press Enter for how to fix it." {
    echo "EmberOS 3 needs a 64-bit VM with at least 2 GB of memory."
    echo ""
    echo "In VirtualBox, power off this VM, then open Settings:"
    echo "  General > Basic:      Type Linux, Version Ubuntu (64-bit)"
    echo "  System > Motherboard: Base Memory 4096 MB"
    echo "  Display > Screen:     Graphics Controller VMSVGA"
    echo ""
    echo "If only 32-bit versions are listed, turn on virtualisation (VT-x/AMD-V)"
    echo "in your PC's BIOS, or turn off Hyper-V / Memory Integrity in Windows."
    sleep --interruptible 600
  }
fi
set timeout=6
insmod all_video
insmod gfxterm
insmod png
loadfont unicode
set gfxmode=1024x768,auto
terminal_output gfxterm
set theme=/boot/grub/themes/ember/theme.txt

menuentry "EmberOS" {
  linux /casper/vmlinuz boot=casper persistent quiet splash ---
  initrd /casper/initrd
}
menuentry "EmberOS (safe graphics)" {
  linux /casper/vmlinuz boot=casper persistent nomodeset quiet splash ---
  initrd /casper/initrd
}
menuentry "EmberOS (without saved files)" {
  linux /casper/vmlinuz boot=casper quiet splash ---
  initrd /casper/initrd
}
if [ "$grub_platform" = "pc" ]; then
  menuentry "EmberOS Classic" {
    linux16 /boot/memdisk
    initrd16 /boot/emberos-classic.img
  }
fi
